version: "3.8"

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://lineup:lineup@db:5432/lineup?schema=public}
      SESSION_SECRET: ${SESSION_SECRET}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lineup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lineup}
      POSTGRES_DB: ${POSTGRES_DB:-lineup}
    volumes:
      - lineup_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lineup}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lineup_pgdata:
